name: Python CI
run-name: Python CI 🧪 · ${{ github.event.head_commit.message }} · by @${{ github.actor }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает права на авто-коммит бейджа

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run tests with coverage
      run: |
        pytest --cov=app --cov-report=term-missing --cov-report=xml tests/ -v
        
    - name: Generate coverage badge
      run: |
        python scripts/generate_badge.py
        
    - name: Commit coverage badge
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: обновлен бейдж покрытия тестами"
        file_pattern: coverage.svg